name: Build Offline Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name bazyaft_mobile --org ir.bazyaftdemo .
      - name: Permit OpenStreetMap tiles
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml')
          text=m.read_text()
          if '<uses-permission android:name="android.permission.INTERNET"' not in text:
              text=text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          m.write_text(text)
          PY2
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazyaft-v05-offline-demo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
